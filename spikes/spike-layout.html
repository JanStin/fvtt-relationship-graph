<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>S1: fcose + compound nodes + varying scale</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a2e; color: #eee; display: flex; height: 100vh; }

    #cy { flex: 1; background: #16213e; }

    #panel {
      width: 340px;
      padding: 16px;
      background: #0f3460;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h1 { font-size: 15px; color: #e94560; }
    h2 { font-size: 13px; color: #a8dadc; margin-bottom: 4px; }

    #status {
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
      text-align: center;
    }
    .pass { background: #1a4a2a; color: #4ade80; border: 1px solid #4ade80; }
    .fail { background: #4a1a1a; color: #f87171; border: 1px solid #f87171; }
    .pending { background: #2a2a1a; color: #fbbf24; border: 1px solid #fbbf24; }

    .stat { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a3a5c; }
    .stat span:last-child { color: #a8dadc; }

    #overlaps { display: flex; flex-direction: column; gap: 4px; }
    .overlap-item {
      background: #3a1a1a;
      border: 1px solid #7f1d1d;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 11px;
      color: #fca5a5;
    }
    .overlap-item .detail { color: #9ca3af; margin-top: 2px; }

    #nodes-list { display: flex; flex-direction: column; gap: 3px; }
    .node-item {
      display: flex;
      justify-content: space-between;
      padding: 3px 6px;
      background: #0d2a4a;
      border-radius: 3px;
      font-size: 11px;
    }
    .node-item .faction { color: #93c5fd; }
    .node-item .scale { color: #86efac; }

    button {
      background: #e94560;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: monospace;
      font-size: 13px;
    }
    button:hover { background: #c73652; }
  </style>
</head>
<body>

<div id="cy"></div>

<div id="panel">
  <h1>S1: fcose + compound nodes + varying scale</h1>

  <div id="status" class="pending">⏳ Running layout…</div>

  <div>
    <h2>Stats</h2>
    <div class="stat"><span>Regular nodes</span><span id="st-nodes">—</span></div>
    <div class="stat"><span>Compound (faction) nodes</span><span id="st-factions">—</span></div>
    <div class="stat"><span>Scale range</span><span id="st-scale">—</span></div>
    <div class="stat"><span>Pairs checked</span><span id="st-pairs">—</span></div>
    <div class="stat"><span>Overlapping pairs</span><span id="st-overlaps">—</span></div>
    <div class="stat"><span>Worst overlap (px)</span><span id="st-worst">—</span></div>
  </div>

  <div id="overlaps-section" style="display:none">
    <h2>Overlapping pairs</h2>
    <div id="overlaps"></div>
  </div>

  <div>
    <h2>Nodes</h2>
    <div id="nodes-list"></div>
  </div>

  <button onclick="rerun()">↻ Re-run layout</button>
</div>

<!-- Cytoscape + fcose from node_modules (relative path for local dev) -->
<script src="../node_modules/cytoscape/dist/cytoscape.min.js"></script>
<script src="../node_modules/cose-base/cose-base.js"></script>
<script src="../node_modules/cytoscape-fcose/cytoscape-fcose.js"></script>

<script>
// ─── Constants ───────────────────────────────────────────────────────────────
const BASE_SIZE = 60; // px, scale=1.0 → 60×60 node

// ─── Fixture data ─────────────────────────────────────────────────────────────
const FACTIONS = [
  { id: 'f-zentarim', label: 'Зентарим',      color: '#6366f1' },
  { id: 'f-church',   label: 'Церковь Тира',   color: '#f97316' },
  { id: 'f-cult',     label: 'Культ',          color: '#a855f7' },
];

// 20 nodes with deliberately varied scales, including some outside factions
const NODES_DATA = [
  // Зентарим — 7 nodes
  { id: 'n01', label: 'Артадель',    faction: 'f-zentarim', scale: 1.0 },
  { id: 'n02', label: 'Дирк',        faction: 'f-zentarim', scale: 1.5 },
  { id: 'n03', label: 'Дрейк',       faction: 'f-zentarim', scale: 2.0 },
  { id: 'n04', label: 'Корвин',      faction: 'f-zentarim', scale: 3.0 },
  { id: 'n05', label: 'Миффи',       faction: 'f-zentarim', scale: 0.75 },
  { id: 'n06', label: 'Лориан',      faction: 'f-zentarim', scale: 1.25 },
  { id: 'n07', label: 'Кендрик',     faction: 'f-zentarim', scale: 0.5 },

  // Церковь Тира — 5 nodes
  { id: 'n08', label: 'Кора',        faction: 'f-church',   scale: 1.0 },
  { id: 'n09', label: 'Перегрин',    faction: 'f-church',   scale: 2.5 },
  { id: 'n10', label: 'Дерек',       faction: 'f-church',   scale: 1.75 },
  { id: 'n11', label: 'Джек',        faction: 'f-church',   scale: 0.5 },
  { id: 'n12', label: '3й ранг',     faction: 'f-church',   scale: 1.0 },

  // Культ — 4 nodes
  { id: 'n13', label: 'Туман',       faction: 'f-cult',     scale: 3.0 },
  { id: 'n14', label: 'Пташка',      faction: 'f-cult',     scale: 1.0 },
  { id: 'n15', label: 'Элигос',      faction: 'f-cult',     scale: 2.0 },
  { id: 'n16', label: 'Лотос',       faction: 'f-cult',     scale: 0.75 },

  // Без фракции — 4 nodes
  { id: 'n17', label: 'Аспид',       faction: null,         scale: 1.5 },
  { id: 'n18', label: 'Цезария',     faction: null,         scale: 1.0 },
  { id: 'n19', label: 'Рид',         faction: null,         scale: 2.0 },
  { id: 'n20', label: 'Стас',        faction: null,         scale: 0.5 },
];

// ─── Build Cytoscape elements ─────────────────────────────────────────────────
function buildElements() {
  const elements = [];

  // Compound faction nodes
  FACTIONS.forEach(f => {
    elements.push({
      data: { id: f.id, label: f.label, isFaction: true, factionColor: f.color }
    });
  });

  // Regular nodes
  NODES_DATA.forEach(n => {
    const size = BASE_SIZE * n.scale;
    elements.push({
      data: {
        id: n.id,
        label: n.label,
        parent: n.faction ?? undefined,
        scale: n.scale,
        size,
        faction: n.faction,
      }
    });
  });

  return elements;
}

// ─── Cytoscape instance ───────────────────────────────────────────────────────
let cy;

function initCy() {
  if (cy) cy.destroy();

  cy = cytoscape({
    container: document.getElementById('cy'),
    elements: buildElements(),

    style: [
      // Faction compound nodes
      {
        selector: 'node[?isFaction]',
        style: {
          'shape': 'round-rectangle',
          'background-color': 'data(factionColor)',
          'background-opacity': 0.15,
          'border-width': 2,
          'border-color': 'data(factionColor)',
          'border-opacity': 0.8,
          'label': 'data(label)',
          'text-valign': 'bottom',
          'text-halign': 'center',
          'font-size': 11,
          'color': '#ccc',
          'padding': '20px',
        }
      },
      // Regular nodes — sized by scale
      {
        selector: 'node[!isFaction]',
        style: {
          'width': 'data(size)',
          'height': 'data(size)',
          'background-color': '#334155',
          'border-width': 2,
          'border-color': '#64748b',
          'label': 'data(label)',
          'text-valign': 'center',
          'text-halign': 'center',
          'font-size': 9,
          'color': '#e2e8f0',
          'text-wrap': 'wrap',
          'text-max-width': 'data(size)',
        }
      },
      // Highlight overlapping nodes (set by checker)
      {
        selector: 'node.overlap',
        style: {
          'border-color': '#ef4444',
          'border-width': 3,
          'background-color': '#7f1d1d',
        }
      },
    ],

    layout: buildLayout(),
  });

  cy.on('layoutstop', () => {
    checkOverlaps();
    renderNodesList();
  });
}

// ─── fcose layout config ─────────────────────────────────────────────────────
function buildLayout() {
  return {
    name: 'fcose',
    animate: true,
    animationDuration: 800,
    randomize: true,
    nodeDimensionsIncludeLabels: false,

    // Repulsion: larger → nodes pushed apart more
    nodeRepulsion: () => 8000,

    // Ideal edge length
    idealEdgeLength: () => 120,

    // Gravity to keep graph compact
    gravity: 0.25,
    gravityRange: 3.8,

    // Compound-specific: padding inside faction nodes
    tilingPaddingVertical: 20,
    tilingPaddingHorizontal: 20,

    // Node separation (minimum gap between node borders)
    nodeSeparation: 20,

    quality: 'default',
    numIter: 2500,
  };
}

// ─── Overlap checker ──────────────────────────────────────────────────────────
function checkOverlaps() {
  const regularNodes = cy.nodes('[!isFaction]');
  const overlaps = [];

  cy.nodes('.overlap').removeClass('overlap');

  const nodeList = regularNodes.toArray();
  for (let i = 0; i < nodeList.length; i++) {
    for (let j = i + 1; j < nodeList.length; j++) {
      const a = nodeList[i];
      const b = nodeList[j];

      const posA = a.position();
      const posB = b.position();
      const rA = (a.data('size') / 2);
      const rB = (b.data('size') / 2);

      const dx = posA.x - posB.x;
      const dy = posA.y - posB.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = rA + rB;

      if (dist < minDist) {
        const depth = minDist - dist;
        overlaps.push({ a, b, dist, minDist, depth });
        a.addClass('overlap');
        b.addClass('overlap');
      }
    }
  }

  renderResults(regularNodes, overlaps);
}

// ─── Render results ───────────────────────────────────────────────────────────
function renderResults(nodes, overlaps) {
  const pairCount = (nodes.length * (nodes.length - 1)) / 2;
  const worstOverlap = overlaps.length > 0
    ? Math.max(...overlaps.map(o => o.depth))
    : 0;

  // Status badge
  const status = document.getElementById('status');
  if (overlaps.length === 0) {
    status.className = 'pass';
    status.textContent = '✅ PASS — no overlaps detected';
  } else {
    status.className = 'fail';
    status.textContent = `❌ FAIL — ${overlaps.length} overlap${overlaps.length > 1 ? 's' : ''} found`;
  }

  // Stats
  document.getElementById('st-nodes').textContent = nodes.length;
  document.getElementById('st-factions').textContent = FACTIONS.length;
  document.getElementById('st-scale').textContent =
    `${Math.min(...NODES_DATA.map(n => n.scale))} – ${Math.max(...NODES_DATA.map(n => n.scale))}`;
  document.getElementById('st-pairs').textContent = pairCount;
  document.getElementById('st-overlaps').textContent = overlaps.length;
  document.getElementById('st-worst').textContent =
    overlaps.length > 0 ? worstOverlap.toFixed(1) : '—';

  // Overlap details
  const section = document.getElementById('overlaps-section');
  const list = document.getElementById('overlaps');
  list.innerHTML = '';
  if (overlaps.length > 0) {
    section.style.display = '';
    overlaps
      .sort((a, b) => b.depth - a.depth)
      .forEach(o => {
        const div = document.createElement('div');
        div.className = 'overlap-item';
        div.innerHTML = `
          <strong>${o.a.data('label')}</strong> ↔ <strong>${o.b.data('label')}</strong>
          <div class="detail">
            dist=${o.dist.toFixed(1)}px &nbsp;|&nbsp;
            need=${o.minDist.toFixed(1)}px &nbsp;|&nbsp;
            overlap=<span style="color:#f87171">${o.depth.toFixed(1)}px</span>
          </div>
          <div class="detail">
            scale: ${o.a.data('scale')} / ${o.b.data('scale')} &nbsp;|&nbsp;
            r: ${(o.a.data('size')/2).toFixed(0)} / ${(o.b.data('size')/2).toFixed(0)}
          </div>
        `;
        list.appendChild(div);
      });
  } else {
    section.style.display = 'none';
  }
}

function renderNodesList() {
  const list = document.getElementById('nodes-list');
  list.innerHTML = '';
  NODES_DATA.forEach(n => {
    const node = cy.getElementById(n.id);
    const pos = node.position();
    const div = document.createElement('div');
    div.className = 'node-item';
    div.innerHTML = `
      <span>${n.label}</span>
      <span class="faction">${n.faction ? FACTIONS.find(f => f.id === n.faction)?.label ?? '—' : '—'}</span>
      <span class="scale">×${n.scale}</span>
    `;
    list.appendChild(div);
  });
}

function rerun() {
  document.getElementById('status').className = 'pending';
  document.getElementById('status').textContent = '⏳ Running layout…';
  initCy();
}

// ─── Boot ─────────────────────────────────────────────────────────────────────
cytoscape.use(cytoscapeFcose);

// Give DOM time to render before querying node sizes
window.addEventListener('DOMContentLoaded', () => initCy());
</script>
</body>
</html>
